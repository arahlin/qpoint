[build-system]
requires = ["setuptools>=77", "extension-helpers>=1.1.1", "setuptools-scm[toml]>7.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qpoint"
authors = [
    {name="Alexandra Rahlin", email="arahlin@users.noreply.github.com"},
]
description = "A lightweight quaternion-based library for efficient telescope pointing"
readme = "README.md"
requires-python = ">=3.9"
urls = {source = "https://github.com/arahlin/qpoint"}
license = "MIT"
dynamic = ["version"]
dependencies = ["numpy>1.10.0", "scipy", "astropy"]

[project.optional-dependencies]
# astropy backs tests/test_astropy.py, which checks the coordinate
# transforms against an independent implementation. The tests skip
# themselves where it is absent.
test = ["pytest", "astropy>=6"]

[tool.setuptools_scm]
write_to = "qpoint/_version.py"
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
